name: CI - Build and Test

on:
  push:
    branches: [ main, develop, 'feature/**' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Verify imports
      run: |
        python -c "import app; import news_service; import utils; print('✓ All imports successful')"
    
    - name: Check Python syntax
      run: |
        python -m py_compile app.py news_service.py utils.py webhook_receiver.py
    
    - name: Test application starts
      run: |
        timeout 10 python app.py &
        sleep 5
        curl -f http://localhost:8001 || exit 1
        pkill -f "python app.py"
      env:
        SECRET_KEY: test_secret_key_for_ci
        DEBUG: false

  docker-build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build Docker image
      run: |
        docker build -t stockpredictor:${{ github.sha }} .
    
    - name: Test Docker image
      run: |
        docker run -d --name test-container -p 8001:8001 \
          -e SECRET_KEY=test_secret \
          stockpredictor:${{ github.sha }}
        sleep 10
        curl -f http://localhost:8001 || exit 1
        docker stop test-container
        docker rm test-container
